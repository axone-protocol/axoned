name: Lint / Agent Skills

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-skills.yml'
      - '.agents/skills/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-skills.yml'
      - '.agents/skills/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-skills:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          uv-version: '0.12.5'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.19.0'

      - name: Install skills-ref tool
        run: uv tool install git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref

      - name: Validate skills with skills-ref
        run: |
          for dir in .agents/skills/*/; do
            skills-ref validate "$dir"
          done

      - name: Validate skills with skill-check
        run: npx skill-check@1.2.0 check --no-security-scan .agents/skills
