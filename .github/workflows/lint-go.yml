name: Lint / Go

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-go.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'flake.nix'
      - 'flake.lock'
      - 'Makefile'
      - '.golangci.yml'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-go.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'flake.nix'
      - 'flake.lock'
      - 'Makefile'
      - '.golangci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Lint go code (golangci-lint)
        run: |
          nix develop --command make lint-go-golangci

      - name: Verify Go modules are tidy
        run: |
          nix develop --command go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "❌ go.mod or go.sum are out of date"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
          echo "✅ go.mod and go.sum are tidy"

      - name: Lint go code (gofumpt)
        run: |
          nix develop --command make lint-go-gofumpt
